name: CI/CD

on:
  push:
    branches:
      - 'master*'
      - 'devel-*'
    tags:
      - '*'
  pull_request:
  schedule:
    - cron: '10 9 1 * *'
  workflow_dispatch:
permissions: {}

jobs:
  dependencies:
    name: Check python/requirements.txt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check requirements.txt
        run: |
          (diff -w <(grep -v -e "python_version >  '3.7'" -e "python_version == '3.8'" -e "python_version >  '3.8'" -e "python_version == '3.9'" -e "python_version >  '3.9'" python/requirements.txt | sed -e "s/;.*//") python/requirements-3.7.txt || true) | (! grep -e "^<")
          (diff -w <(grep -v -e "python_version <= '3.7'" -e "python_version >  '3.8'" -e "python_version == '3.9'" -e "python_version >  '3.9'" python/requirements.txt | sed -e "s/;.*//") python/requirements-3.8.txt || true) | (! grep -e "^<")
          (diff -w <(grep -v -e "python_version <= '3.7'" -e "python_version == '3.8'" -e "python_version >  '3.9'" python/requirements.txt | sed -e "s/;.*//") <(sed -e "s/;.*//" python/requirements-3.9.txt) || true) | (! grep -e "^<")
          (diff -w <(grep -v -e "python_version <= '3.7'" -e "python_version == '3.8'" -e "python_version <= '3.9'" -e "python_version == '3.9'" python/requirements.txt | sed -e "s/;.*//") <(sed -e "s/;.*//" python/requirements-3.10.txt) || true) | (! grep -e "^<")
          (diff -w <(grep -v -e "python_version <= '3.7'" -e "python_version == '3.8'" -e "python_version <= '3.9'" -e "python_version == '3.9'" python/requirements.txt | sed -e "s/;.*//") <(sed -e "s/;.*//" python/requirements-post-3.10.txt) || true) | (! grep -e "^<")
        shell: bash

  upgrade:
    name: Check Upgrades
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.8'
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.9'
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.10'
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.15'
      - name: Check for dependency updates
        continue-on-error: true
        run: |
          pip install tox
          tox
          git diff | tee diff
          if [ -s "diff" ]; then
            echo 'Dependencies can be upgraded' >> $GITHUB_STEP_SUMMARY
            echo '```diff' >> $GITHUB_STEP_SUMMARY
            cat diff >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
        shell: bash

  test-mac:
    name: "Test macOS"
    uses: "./.github/workflows/test-os.yml"
    with:
      os: '["macos-15", "macos-26"]'
      python-version: '["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "installed"]'
      include: '[]'

  test-lnx:
    name: "Test Ubuntu"
    uses: "./.github/workflows/test-os.yml"
    with:
      os: '["ubuntu-22.04", "ubuntu-22.04-arm", "ubuntu-24.04", "ubuntu-24.04-arm", "ubuntu-slim"]'
      python-version: '["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "installed"]'
      include: >
        [
          {"os": "ubuntu-22.04", "python-version": "3.8"},
          {"os": "ubuntu-26.04", "python-version": "3.13"},
          {"os": "ubuntu-26.04", "python-version": "3.14"},
          {"os": "ubuntu-26.04", "python-version": "3.15"},
          {"os": "ubuntu-26.04-arm", "python-version": "3.13"},
          {"os": "ubuntu-26.04-arm", "python-version": "3.14"},
          {"os": "ubuntu-26.04-arm", "python-version": "3.15"},
        ]

  test-win:
    name: "Test Windows"
    uses: "./.github/workflows/test-os.yml"
    with:
      os: '["windows-2022", "windows-2025"]'
      python-version: '["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "installed"]'
      include: '[]'

  publish:
    name: "Publish"
    needs: [test-mac, test-lnx, test-win]
    # we run the action from this branch whenever we can (when it runs in our repo's context)
    if: >
      ! cancelled() &&
      github.event.sender.login != 'dependabot[bot]' &&
      ( github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository )
    uses: "./.github/workflows/publish.yml"
    permissions:
      checks: write
      pull-requests: write
      security-events: write

  config-deploy:
    name: Configure Deployment
    needs: [test-mac, test-lnx, test-win]
    # do not build or deploy on forked repositories
    if: github.repository_owner == 'EnricoMi'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.action.outputs.image }}
      image-digest: ${{ steps.action.outputs.digest }}
      image-exists: ${{ steps.image.outputs.exists }}
      image-pinned: ${{ steps.action.outputs.pinned }}
      image-version: ${{ steps.action.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Extract action image and version
        # we deploy from a specific commit on master (the one that mentions a new version the first time)
        # so we need to tell docker/metadata-action to extract docker tags from that version
        id: action
        run: |
          image=$(grep -A 10 "^runs:" action.yml | grep -E "^\s+image:\s" | sed -E -e "s/^\s+image:\s*'//" -e "s/docker:\/\///" -e "s/'\s*$//")
          digest=""
          pinned=false
          if [[ "$image" =~ ^[^:@]+:(v[0-9]+\.[0-9]+\.[0-9]+)(@(sha256:[0-9a-f]{64}))?$ ]]
          then
            # releases first publish the image from a commit with ':vX.Y.Z',
            # then pin the image with a commit with ':vX.Y.Z@sha256:…'
            version="${BASH_REMATCH[1]}"
            digest="${BASH_REMATCH[3]}"
            if [[ -n "$digest" ]]; then pinned=true; fi
          elif [[ "$image" == "Dockerfile" ]]
          then
            version="$image"
          else
            echo "::error file=action.yml::Image must look like 'docker://name:vX.Y.Z' or 'docker://name:vX.Y.Z@sha256:<digest>', or be 'Dockerfile': $image"
            exit 1
          fi
          echo "image=$image" >>$GITHUB_OUTPUT
          echo "version=$version" >>$GITHUB_OUTPUT
          echo "digest=$digest" >>$GITHUB_OUTPUT
          echo "pinned=$pinned" >>$GITHUB_OUTPUT
        shell: bash

      - name: Check action image existence
        id: image
        if: steps.action.outputs.pinned != 'true'
        env:
          DOCKER_CLI_EXPERIMENTAL: enabled
          IMAGE: ${{ steps.action.outputs.image }}
        run: |
          if docker manifest inspect "$IMAGE"
          then
            echo "exists=true" >>$GITHUB_OUTPUT
          fi
        shell: bash

      - name: Check pinned image digest matches its tag
        if: steps.action.outputs.pinned == 'true'
        env:
          IMAGE: ${{ steps.action.outputs.image }}
          DIGEST: ${{ steps.action.outputs.digest }}
        run: |
          tagged="${IMAGE%@*}"
          actual=$(docker buildx imagetools inspect "$tagged" --format '{{json .Manifest}}' | jq -r .digest)
          if [[ "$actual" != "$DIGEST" ]]
          then
            echo "::error file=action.yml::Digest in action.yml does not match image $tagged: expected $DIGEST, found $actual"
            exit 1
          fi
          echo "$tagged has digest $actual"
        shell: bash

      - name: Check git tag matches the pinned image
        if: startsWith(github.ref, 'refs/tags/v') && steps.action.outputs.image != 'Dockerfile'
        env:
          PINNED: ${{ steps.action.outputs.pinned }}
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          if [[ "$PINNED" != "true" ]]
          then
            echo "::error file=action.yml::Git tag $GITHUB_REF_NAME must point to a commit that pins the image by digest"
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$GITHUB_REF_NAME" != "$VERSION" ]]
          then
            echo "::error file=action.yml::Git tag $GITHUB_REF_NAME does not match image version $VERSION in action.yml"
            exit 1
          fi
        shell: bash

  test-published-image:
    name: Test Published Image (${{ matrix.arch }})
    needs: config-deploy
    # the publish workflow tests images built from this commit, here we test the image users get;
    # the condition is on the job, as a Docker action's image may be pulled even if its step is skipped
    if: >
      needs.config-deploy.outputs.image-pinned == 'true' &&
      github.event.sender.login != 'dependabot[bot]' &&
      ( github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository )
    runs-on: ${{ matrix.os }}
    permissions:
      checks: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Copy test junit xml files
        run: cp -rv python/test/files/junit-xml test-files
        shell: bash

      - name: Publish Test Results (Docker action)
        id: action
        uses: ./
        with:
          check_name: Test Results (Published Image ${{ matrix.arch }}, Docker action)
          comment_mode: "off"
          fail_on: nothing
          files: "test-files/pytest/junit.gloo.standalone.xml"
          json_file: "tests-action.json"

      - name: Assert JSON output (Docker action)
        uses: ./misc/action/json-output
        with:
          json: '${{ steps.action.outputs.json }}'
          json_file: 'tests-action.json'

      - name: Publish Test Results (composite docker action)
        id: docker
        if: (!cancelled())
        uses: ./docker
        with:
          check_name: Test Results (Published Image ${{ matrix.arch }}, composite docker action)
          comment_mode: "off"
          fail_on: nothing
          files: "test-files/pytest/junit.gloo.standalone.xml"
          json_file: "tests-docker.json"

      - name: Assert JSON output (composite docker action)
        if: (!cancelled())
        uses: ./misc/action/json-output
        with:
          json: '${{ steps.docker.outputs.json }}'
          json_file: 'tests-docker.json'

  deploy:
    name: Deploy to GitHub
    needs: [publish, config-deploy]

    # do not build or deploy on forked repositories
    if: github.repository_owner == 'EnricoMi'
    runs-on: ubuntu-latest
    env:
      # deploy image actions from commits pushed to master, unless action.yml pins the image by digest, and
      # deploy Dockerfile actions from pushed version tags (no major versions)
      PUSH_IMAGE: >-
        ${{
          github.event_name == 'push' && (
            needs.config-deploy.outputs.image != 'Dockerfile' && startsWith(github.ref, 'refs/heads/master') && needs.config-deploy.outputs.image-pinned != 'true' && needs.config-deploy.outputs.image-exists != 'true' ||
            needs.config-deploy.outputs.image == 'Dockerfile' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '.')
          )
        }}
    steps:
      - name: Docker meta
        id: docker-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/EnricoMi/publish-unit-test-result-action
          flavor: |
            latest=false
            prefix=v
          tags: |
            type=sha
            type=ref,event=tag
            type=semver,pattern={{major}},value=${{ needs.config-deploy.outputs.image-version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.config-deploy.outputs.image-version }}
            type=semver,pattern={{version}},value=${{ needs.config-deploy.outputs.image-version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: ${{ env.PUSH_IMAGE }}
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false

      - name: Print pinned image reference
        if: env.PUSH_IMAGE == 'true' && needs.config-deploy.outputs.image != 'Dockerfile'
        env:
          IMAGE: ${{ needs.config-deploy.outputs.image }}
          VERSION: ${{ needs.config-deploy.outputs.image-version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Pin the published image"
            echo
            echo "\`action.yml\`: \`image: 'docker://$IMAGE@$DIGEST'\`"
            echo
            echo "\`docker/action.yml\`: \`default: '$VERSION@$DIGEST'\`"
          } >>"$GITHUB_STEP_SUMMARY"
        shell: bash

  event_file:
    name: "Event File"
    runs-on: ubuntu-latest
    steps:
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: Event File
          path: ${{ github.event_path }}
